# =========================
# Server Port
# =========================
server.port=${PORT:8080}
server.address=0.0.0.0

# =========================
# MySQL datasource
# =========================
# spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:techstore_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.username=${DB_USER:techstore_user}
# spring.datasource.password=${DB_PASS:Techstore@12345}

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:laptopstore_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:${DB_USER:laptopstore_user}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:laptopstore@12345}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================
# H2 console (tắt vì dùng MySQL)
# =========================
spring.h2.console.enabled=false

# =========================
# Seed demo data
# =========================
app.seed.demo=${APP_SEED_DEMO:true}

# =========================
# Demo Mode & Demo Admin Configuration
# =========================
demo.mode=${DEMO_MODE:false}
demo.admin.enabled=${DEMO_ADMIN_ENABLED:false}
demo.admin.email=${DEMO_ADMIN_EMAIL:}
demo.admin.password=${DEMO_ADMIN_PASSWORD:}
demo.email.enabled=${DEMO_EMAIL_ENABLED:false}

# =========================
# SendGrid Mail Configuration
# =========================
sendgrid.api-key=${SENDGRID_API_KEY:dummy-key-for-dev}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:LAPTOPSTORE247sp@gmail.com}

# =========================
# OTP Configuration
# =========================
otp.length=${OTP_LENGTH:6}
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
otp.resend-wait-seconds=${OTP_RESEND_WAIT_SECONDS:60}

# =========================
# Payment Configuration (SEPAY)
# =========================
payment.sepay.va-account=${SEPAY_VA_ACCOUNT:5282587777}
payment.sepay.bank-code=${SEPAY_BANK_CODE:MBBank}
payment.sepay.qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}

# Order Payment Deadline
order.payment-deadline-minutes=${ORDER_PAYMENT_DEADLINE_MINUTES:15}

# =========================
# Scheduling (Task Scheduler)
# =========================
spring.task.scheduling.pool.size=2

# =========================
# RAG AI Service
# =========================
rag.service.url=${RAG_SERVICE_URL:http://127.0.0.1:8000}

