# =========================
# MySQL datasource (Demo)
# =========================
# Bạn có thể đổi các biến môi trường để không hard-code vào file:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:techstore_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:techstore_user}
spring.datasource.password=${DB_PASS:Techstore@12345}

# spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:laptopstore_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
# spring.datasource.username=${DB_USERNAME:${DB_USER:laptopstore_user}}
# spring.datasource.password=${DB_PASSWORD:${DB_PASS:laptopstore@12345}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
# update: giữ dữ liệu giữa các lần chạy
# create-drop: mỗi lần stop app sẽ drop bảng (demo reset)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================
# H2 console (tắt vì dùng MySQL)
# =========================
spring.h2.console.enabled=false

# =========================
# Seed demo data
# =========================
app.seed.demo=true

# Dummy key for dev
sendgrid.api-key=dummy-key-for-dev

# =========================
# OTP Configuration
# =========================
otp.length=6
otp.expiry-minutes=5
otp.max-attempts=5
otp.resend-wait-seconds=60

# =========================
# Payment Configuration
# =========================
# SEPAY
payment.sepay.va-account=0984149067
payment.sepay.bank-code=MBBank
payment.sepay.qr-base-url=https://qr.sepay.vn/img
payment.sepay.webhook-secret=YOUR_SEPAY_WEBHOOK_SECRET_KEY

# Order Payment Deadline
order.payment-deadline-minutes=15

# Order Return Window
order.return-window-days=7

# =========================
# Scheduling (Task Scheduler)
# =========================
spring.task.scheduling.pool.size=2

# =========================
# RAG AI Service
# =========================
rag.service.url=http://127.0.0.1:8000
