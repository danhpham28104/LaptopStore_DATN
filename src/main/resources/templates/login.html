<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Đăng nhập – LaptopStore</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="login-page">

<main class="main d-flex justify-content-center align-items-center" style="min-height:100vh;padding:20px 0;">
    <div class="col-lg-4 col-md-6 col-sm-10 col-11">
        <div class="auth-container">

            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class="bi bi-laptop"></i>
                </div>
                <span class="logo-text">LaptopStore</span>
            </div>

            <!-- Title -->
            <div class="auth-title">
                <h3>Chào mừng trở lại! 👋</h3>
                <p>Đăng nhập để tiếp tục mua sắm</p>
            </div>

            <!-- Success message -->
            <div th:if="${success}" class="auth-success" th:text="${success}"></div>

            <!-- Login Form – giữ nguyên action và name -->
            <form th:action="@{/auth/login}" method="post">

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="auth-label">Tên đăng nhập</label>
                    <div class="auth-input-group">
                        <i class="bi bi-person auth-input-icon"></i>
                        <input type="text" id="username" name="username"
                               class="auth-input"
                               placeholder="Nhập tên đăng nhập" required
                               autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-2">
                    <label for="password" class="auth-label">Mật khẩu</label>
                    <div class="auth-input-group" style="position:relative;">
                        <i class="bi bi-lock auth-input-icon"></i>
                        <input type="password" id="password" name="password"
                               class="auth-input"
                               placeholder="Nhập mật khẩu" required
                               autocomplete="current-password">
                        <button type="button" id="togglePassword"
                                style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:0;">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Forgot password -->
                <div class="auth-forgot mb-3">
                    <a th:href="@{/forgot-password}" class="auth-link" style="font-size:0.84rem;">
                        Quên mật khẩu?
                    </a>
                </div>

                <!-- Error / logout messages -->
                <div th:if="${param.error}" class="auth-error">
                    <i class="bi bi-exclamation-circle me-2"></i>Sai tên đăng nhập hoặc mật khẩu!
                </div>
                <div th:if="${param.logout}" class="auth-success">
                    <i class="bi bi-check-circle me-2"></i>Bạn đã đăng xuất thành công!
                </div>

                <!-- Submit -->
                <button type="submit" class="auth-btn mt-2">
                    Đăng nhập <i class="bi bi-arrow-right-short"></i>
                </button>

                <!-- Register link -->
                <div class="text-center mt-4" style="font-size:0.88rem;color:var(--muted);">
                    Chưa có tài khoản?
                    <a th:href="@{/register}" class="auth-link ms-1">Đăng ký ngay</a>
                </div>

            </form>

        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('togglePassword');
  const pwInput   = document.getElementById('password');
  const eyeIcon   = document.getElementById('eyeIcon');

  if (toggleBtn) {
    toggleBtn.addEventListener('click', function () {
      const isPassword = pwInput.type === 'password';
      pwInput.type = isPassword ? 'text' : 'password';
      eyeIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  }
</script>

</body>
</html>
