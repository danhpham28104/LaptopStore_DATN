<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Xác thực OTP - LaptopStore</title>

  <!-- Favicon -->
  <link th:href="@{/assets/img/favicon.png}" rel="icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/main.css}" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">

  <style>
    .otp-container {
      max-width: 500px;
      margin: 60px auto;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #2d3748;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      background: linear-gradient(135deg, #ffffff 0%, #f7fafc 100%);
      position: relative;
    }

    .otp-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }

    .otp-title {
      text-align: center;
      margin-bottom: 24px;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .otp-icon {
      text-align: center;
      font-size: 55px;
      margin-bottom: 16px;
      animation: pulse-lock 2s infinite ease-in-out;
    }

    @keyframes pulse-lock {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 6px rgba(102, 126, 234, 0.15)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 10px 15px rgba(118, 75, 162, 0.3)); }
    }

    .otp-input-group {
      margin: 24px 0;
    }

    .otp-input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
    }

    .otp-code {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 12px;
      text-align: center;
      padding: 12px;
      background: #edf2f7;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      font-family: 'Courier New', monospace;
      color: #2d3748;
      transition: all 0.3s ease;
    }

    .otp-code:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
      color: #2d3748;
    }

    .otp-code::placeholder {
      color: #a0aec0;
      opacity: 0.6;
    }

    .otp-timer {
      text-align: center;
      margin: 16px 0;
      font-size: 15px;
      color: #718096;
    }

    .otp-timer .time-left {
      font-weight: 700;
      color: #e53e3e;
      background: rgba(229, 62, 62, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .otp-info {
      background: #ebf8ff;
      border-left: 4px solid #3182ce;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 13px;
      color: #2b6cb0;
      line-height: 1.6;
    }

    .btn-verify {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-verify:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
    }

    .btn-verify:disabled {
      background: #cbd5e0;
      color: #a0aec0;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-resend {
      width: 100%;
      padding: 11px;
      background: transparent;
      color: #4a5568;
      border: 2px solid #cbd5e0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-resend:hover:not(:disabled) {
      background: #edf2f7;
      border-color: #a0aec0;
      color: #2d3748;
    }

    .btn-resend:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert-message {
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      text-align: center;
      display: none;
      font-size: 14px;
      font-weight: 600;
    }

    .alert-success {
      background: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .alert-error {
      background: #fed7d7;
      color: #742a2a;
      border: 1px solid #feb2b2;
    }

    .order-summary {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .order-summary h5 {
      font-size: 13px;
      margin-bottom: 8px;
      font-weight: 700;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .order-code {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      color: #2b6cb0;
      font-size: 15px;
    }
  </style>
</head>

<body>

<!-- Header -->
<div th:replace="fragments/header :: siteHeader"></div>

<main class="main">
  <div class="otp-container">
    
    <!-- Icon -->
    <div class="otp-icon">🔐</div>

    <!-- Title -->
    <div class="otp-title">Xác thực OTP</div>

    <!-- Order Summary -->
    <div class="order-summary" th:if="${order}">
      <h5>Thông tin đơn hàng:</h5>
      <div>Mã đơn: <span class="order-code" th:text="${order.orderCode}"></span></div>
      <div>Tổng tiền: <span th:text="${#numbers.formatCurrency(order.totalAmount)}"></span></div>
    </div>

    <!-- Info -->
    <div class="otp-info">
      <strong>📱 Mã OTP đã được gửi đến:</strong><br>
      <span th:text="'SĐT: ' + ${phone}"></span>
      <br><br>
      ✓ Nhập mã OTP 6 chữ số<br>
      ✓ Mã hết hạn trong <strong>5 phút</strong><br>
      ✓ Không chia sẻ mã OTP với ai
    </div>

    <!-- Form -->
    <form id="otpForm">
      <!-- OTP Input -->
      <div class="otp-input-group">
        <label>Mã OTP</label>
        <input 
          type="text" 
          id="otpCode" 
          class="form-control otp-code" 
          placeholder="000000"
          maxlength="6"
          inputmode="numeric"
          pattern="[0-9]{6}"
          required>
      </div>

      <!-- Timer -->
      <div class="otp-timer">
        Hết hạn trong <span class="time-left" id="otpTimer">5:00</span>
      </div>

      <!-- Alert -->
      <div id="alertMessage" class="alert-message"></div>

      <!-- Verify Button -->
      <button 
        type="submit" 
        class="btn-verify" 
        id="verifyBtn">
        ✓ Xác thực OTP
      </button>

      <!-- Resend Button -->
      <button 
        type="button" 
        class="btn-resend" 
        id="resendBtn"
        disabled>
        🔄 Gửi lại OTP (<span id="resendTimer">60</span>s)
      </button>
    </form>

    <!-- Hidden fields -->
    <input type="hidden" id="phone" th:value="${phone}">
    <input type="hidden" id="orderId" th:value="${orderId}">
  </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: siteFooter"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- OTP Script -->
<script>
  const otpForm = document.getElementById('otpForm');
  const otpCode = document.getElementById('otpCode');
  const verifyBtn = document.getElementById('verifyBtn');
  const resendBtn = document.getElementById('resendBtn');
  const alertMessage = document.getElementById('alertMessage');
  const phone = document.getElementById('phone').value;
  const orderId = document.getElementById('orderId').value;

  let otpTimer = 300; // 5 phút
  let resendTimer = 60; // 60 giây
  let resendAllowed = false;
  let otpInterval = null;
  let resendInterval = null;

  // ========== Timer cho OTP ==========
  function startOtpTimer() {
    if (otpInterval) {
      clearInterval(otpInterval);
    }
    otpTimer = 300; // reset
    const otpTimerElement = document.getElementById('otpTimer');
    
    otpInterval = setInterval(() => {
      otpTimer--;
      const minutes = Math.floor(otpTimer / 60);
      const seconds = otpTimer % 60;
      otpTimerElement.textContent = 
        `${minutes}:${String(seconds).padStart(2, '0')}`;

      if (otpTimer <= 0) {
        clearInterval(otpInterval);
        showAlert('OTP hết hạn. Vui lòng gửi lại.', 'error');
        verifyBtn.disabled = true;
        otpCode.disabled = true;
      }
    }, 1000);
  }

  // ========== Timer cho Resend ==========
  function startResendTimer() {
    if (resendInterval) {
      clearInterval(resendInterval);
    }
    resendTimer = 60;
    resendAllowed = false;
    resendBtn.disabled = true;
    const resendTimerElement = document.getElementById('resendTimer');

    resendInterval = setInterval(() => {
      resendTimer--;
      resendTimerElement.textContent = resendTimer;

      if (resendTimer <= 0) {
        clearInterval(resendInterval);
        resendAllowed = true;
        resendBtn.disabled = false;
        resendTimerElement.textContent = '0';
      }
    }, 1000);
  }

  // ========== Send OTP ==========
  async function sendOtp() {
    try {
      const response = await fetch('/otp/send?phone=' + phone, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      });

      const data = await response.json();
      if (data.success) {
        showAlert('✓ OTP đã được gửi', 'success');
        startOtpTimer();
        startResendTimer();
      } else {
        showAlert('❌ ' + data.message, 'error');
      }
    } catch (error) {
      showAlert('❌ Lỗi: ' + error.message, 'error');
    }
  }

  // ========== Verify OTP ==========
  async function verifyOtp(code) {
    if (code.length !== 6 || !/^\d+$/.test(code)) {
      showAlert('❌ OTP phải là 6 chữ số', 'error');
      return;
    }

    verifyBtn.disabled = true;

    try {
      const response = await fetch('/otp/verify', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: `phone=${phone}&code=${code}&orderId=${orderId}`
      });

      const data = await response.json();
      if (data.success) {
        showAlert('✓ ' + data.message, 'success');
        if (otpInterval) clearInterval(otpInterval);
        if (resendInterval) clearInterval(resendInterval);
        
        setTimeout(() => {
          window.location.href = data.redirectUrl;
        }, 2000);
      } else {
        showAlert('❌ ' + data.message, 'error');
        verifyBtn.disabled = false;
      }
    } catch (error) {
      showAlert('❌ Lỗi: ' + error.message, 'error');
      verifyBtn.disabled = false;
    }
  }

  // ========== Resend OTP ==========
  async function resendOtp() {
    if (!resendAllowed) return;

    try {
      const response = await fetch('/otp/resend?phone=' + phone, {
        method: 'POST'
      });

      const data = await response.json();
      if (data.success) {
        showAlert('✓ ' + data.message, 'success');
        otpCode.value = '';
        otpTimer = 300; // Reset timer
        startOtpTimer();
        startResendTimer();
      } else {
        showAlert('❌ ' + data.message, 'error');
      }
    } catch (error) {
      showAlert('❌ Lỗi: ' + error.message, 'error');
    }
  }

  // ========== Show Alert ==========
  function showAlert(message, type) {
    alertMessage.textContent = message;
    alertMessage.className = 'alert-message alert-' + type;
    alertMessage.style.display = 'block';

    if (type === 'success') {
      setTimeout(() => {
        alertMessage.style.display = 'none';
      }, 3000);
    }
  }

  // ========== Event Listeners ==========
  otpForm.addEventListener('submit', (e) => {
    e.preventDefault();
    verifyOtp(otpCode.value);
  });

  resendBtn.addEventListener('click', (e) => {
    e.preventDefault();
    resendOtp();
  });

  // Auto-send OTP on page load
  sendOtp();

  // Format OTP input (chỉ cho phép số)
  otpCode.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
  });
</script>

</body>
</html>
