<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Quản lý Danh mục - LaptopStore Admin'">Quản lý Danh mục</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background-color: #f6f7fb; font-family: 'Segoe UI', sans-serif; }
    .cat-icon-badge {
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #eef2ff;
      color: #4f46e5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/admin_sidebar :: adminSidebar('categories')}"></div>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container-fluid justify-content-end align-items-center gap-3">

    <a th:href="@{/}" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1">
      <i class="bi bi-globe"></i> Xem Website
    </a>

    <span class="text-secondary fw-semibold">
      👋 Xin chào, Admin
    </span>

    <form th:action="@{/logout}" method="post">
      <button class="btn btn-sm btn-outline-danger" type="submit">
        <i class="bi bi-box-arrow-right"></i> Đăng xuất
      </button>
    </form>

  </div>
</nav>

<!-- Content -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold m-0">Quản lý Danh mục</h4>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
      <i class="bi bi-plus-circle"></i> Thêm danh mục
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body table-responsive">
      <table class="table align-middle table-hover">
        <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Icon</th>
          <th>Tên danh mục</th>
          <th>Slug</th>
          <th>Mô tả</th>
          <th>Số SP</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
          <td th:text="${c.id}"></td>
          <td>
            <div class="cat-icon-badge">
              <i th:class="'bi ' + ${c.icon ?: 'bi-grid'}"></i>
            </div>
          </td>
          <td class="fw-bold" th:text="${c.name}"></td>
          <td><code th:text="${c.slug}"></code></td>
          <td th:text="${c.description}"></td>
          <td>
            <span class="badge bg-secondary" th:text="${c.products != null ? c.products.size() : 0}">0</span>
          </td>
          <td>
            <span th:text="${c.active ? 'Hoạt động' : 'Ngừng'}"
                  th:classappend="${c.active} ? 'text-success fw-bold' : 'text-danger fw-bold'"></span>
          </td>
          <td>
            <button class="btn btn-warning btn-sm" data-bs-toggle="modal"
                    th:data-bs-target="'#editModal_' + ${c.id}">
              <i class="bi bi-pencil"></i>
            </button>
            <form th:action="@{'/admin/categories/delete/' + ${c.id}}" method="post" style="display:inline;">
              <button class="btn btn-danger btn-sm" onclick="return confirm('Xóa danh mục này?')">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}">
          <td colspan="8" class="text-center text-muted">Chưa có danh mục nào</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal thêm Category -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/admin/categories/add}" method="post">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Thêm Danh mục</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-12">
            <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
            <input name="name" type="text" class="form-control" placeholder="Ví dụ: Laptop Gaming" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Icon Bootstrap Class</label>
            <input name="icon" type="text" class="form-control" placeholder="Ví dụ: bi-controller, bi-briefcase">
            <div class="form-text">Icon hiển thị từ Bootstrap Icons (VD: <code>bi-controller</code>, <code>bi-laptop</code>)</div>
          </div>
          <div class="col-md-12">
            <label class="form-label">Slug (đường dẫn)</label>
            <input name="slug" type="text" class="form-control" placeholder="Để trống hệ thống sẽ tự sinh">
          </div>
          <div class="col-md-12">
            <label class="form-label">Mô tả</label>
            <textarea name="description" class="form-control" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary">Lưu</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal sửa Category -->
<div th:each="c : ${categories}">
  <div class="modal fade" th:id="'editModal_' + ${c.id}" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form th:action="@{'/admin/categories/edit/' + ${c.id}}" method="post">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Sửa Danh mục</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body row g-3">
            <div class="col-md-12">
              <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" th:value="${c.name}" required>
            </div>

            <div class="col-md-12">
              <label class="form-label">Icon Bootstrap Class</label>
              <input type="text" name="icon" class="form-control" th:value="${c.icon}">
            </div>

            <div class="col-md-12">
              <label class="form-label">Slug (đường dẫn)</label>
              <input type="text" name="slug" class="form-control" th:value="${c.slug}">
            </div>

            <div class="col-md-12">
              <label class="form-label">Mô tả</label>
              <textarea name="description" class="form-control" rows="2"
                        th:text="${c.description}"></textarea>
            </div>

            <div class="col-md-12">
              <label class="form-label">Trạng thái</label>
              <select name="active" class="form-select">
                <option value="true" th:selected="${c.active}">Hoạt động</option>
                <option value="false" th:selected="${!c.active}">Ngừng</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary">Cập nhật</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div id="toastMessage" class="toast text-white bg-success border-0 shadow">
    <div class="d-flex">
      <div class="toast-body" id="toastText"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    let message = "", type = "success";

    if (params.get("success") === "added") message = "Đã thêm danh mục thành công!";
    if (params.get("success") === "updated") message = "Đã cập nhật danh mục!";
    if (params.get("success") === "deleted") { message = "Đã xoá danh mục!"; type = "danger"; }
    if (params.get("error") === "exists") { message = "Tên danh mục đã tồn tại!"; type = "danger"; }
    if (params.get("error") === "has_products") { message = "Không thể xóa danh mục đang chứa sản phẩm!"; type = "danger"; }
    if (params.get("error") === "notfound") { message = "Không tìm thấy danh mục!"; type = "danger"; }

    if (message) {
      const toastEl = document.getElementById("toastMessage");
      const toastText = document.getElementById("toastText");
      toastText.textContent = message;

      toastEl.classList.remove("bg-success", "bg-danger");
      toastEl.classList.add(type === "danger" ? "bg-danger" : "bg-success");

      new bootstrap.Toast(toastEl).show();
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
