  <!DOCTYPE html>
  <html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Quản lý đơn hàng - LaptopStore Admin'">Quản lý đơn hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
      body { background-color: #f6f7fb; font-family: 'Segoe UI', sans-serif; }
      .admin-suggest-dropdown {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        min-width: 400px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        z-index: 1050;
        max-height: 420px;
        overflow-y: auto;
      }
      .admin-suggest-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 12px;
        text-decoration: none;
        color: #1f2937;
        border-bottom: 1px solid #f3f4f6;
        cursor: pointer;
      }
      .admin-suggest-item:hover,
      .admin-suggest-item.active {
        background: #f8fafc;
      }
      .admin-suggest-footer {
        display: block;
        width: 100%;
        padding: 9px 12px;
        text-align: center;
        font-size: 0.84rem;
        font-weight: 600;
        color: #d70018;
        background: #fff5f6;
        border: none;
        cursor: pointer;
      }
      .admin-suggest-footer:hover {
        background: #ffe8eb;
      }
    </style>
  </head>

  <body>
  <!-- Sidebar -->
<div th:replace="~{fragments/admin_sidebar :: adminSidebar('orders')}"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container-fluid justify-content-end align-items-center gap-3">

      <a th:href="@{/}" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1">
        <i class="bi bi-globe"></i> Xem Website
      </a>

      <span class="text-secondary fw-semibold">
        👋 Xin chào, Admin
      </span>

      <form th:action="@{/logout}" method="post">
        <button class="btn btn-sm btn-outline-danger" type="submit">
          <i class="bi bi-box-arrow-right"></i> Đăng xuất
        </button>
      </form>

    </div>
  </nav>

  <!-- Content -->
  <div class="content">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold">Quản lý đơn hàng</h4>
      <form class="search-form desktop-search-form me-3 position-relative"
            id="adminOrderSearchForm"
            th:action="@{/admin/orders/search}"
            method="get"
            style="min-width: 350px;">

        <div class="input-group">
          <input type="text"
                 class="form-control"
                 id="adminOrderSearchInput"
                 name="q"
                 placeholder="Tìm theo ID, mã đơn, tên KH, SĐT, sản phẩm…"
                 th:value="${q}"
                 autocomplete="off">

          <button class="btn btn-primary" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </div>

        <div id="adminOrderSuggestBox" class="admin-suggest-dropdown d-none"></div>
      </form>
    </div>

    <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />

    <!-- 🔹 Bulk Action Toolbar -->
    <div id="bulkToolbar" style="display:none;" class="mb-3 p-3 bg-white border rounded shadow-sm">
      <div class="d-flex align-items-center gap-2">
        <span class="fw-semibold text-primary"><span id="selectedCount">0</span> đơn hàng được chọn</span>
        <select id="bulkStatus" class="form-select form-select-sm d-inline-block w-auto ms-2">
          <option value="">-- Chuyển sang trạng thái --</option>
          <option th:each="st : ${T(com.laptopstore.laptopstore.enums.OrderStatus).values()}"
                  th:if="${st.name() != 'CHO_THANH_TOAN'}"
                  th:value="${st.name()}"
                  th:text="${st.displayName}">
          </option>
        </select>
        <button class="btn btn-primary btn-sm ms-1" onclick="applyBulkStatus()">
          <i class="bi bi-check-circle"></i> Áp dụng
        </button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body table-responsive">
        <table class="table align-middle table-hover">
          <thead class="table-light">
          <tr>
            <th><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
            <th>ID</th>
            <th>Người đặt</th>
            <th>SĐT</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th class="text-center">Hành động</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="o : ${orders}">
            <td><input type="checkbox" class="order-checkbox" th:value="${o.id}"></td>
            <td th:text="${o.id}"></td>
            <td th:text="${o.receiverName}"></td>
            <td th:text="${o.receiverPhone}"></td>
            <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
            <td>
              <!-- Badge màu theo trạng thái + trạng thái trừ kho -->
              <div class="d-flex flex-wrap align-items-center gap-1">
                <span class="badge" th:classappend="${o.orderStatus.badgeClass}"
                      th:text="${o.orderStatus.displayName}">
                </span>
                <span th:if="${o.inventoryDeducted}"
                      class="badge bg-light text-success border border-success"
                      title="Đã trừ tồn kho và giữ hàng cho đơn này">
                  <i class="bi bi-box-seam"></i> Đã giữ kho
                </span>
                <span th:if="${o.lockedForEdit}"
                      class="badge bg-light text-secondary border"
                      title="Dữ liệu đơn hàng đã khóa">
                  <i class="bi bi-lock-fill"></i> Đã khóa
                </span>
              </div>

              <!-- Chỉ hiện các trạng thái tiếp theo hợp lệ, có hộp thoại xác nhận -->
              <form th:if="${!#lists.isEmpty(o.orderStatus.allowedNextStatuses)}"
                    th:action="@{'/admin/orders/update-status/' + ${o.id}}"
                    method="post"
                    th:attr="data-order-code=${o.orderCode != null ? o.orderCode : '#' + o.id}"
                    onsubmit="return confirmOrderStatusChange(this)"
                    class="d-flex align-items-center mt-2">

                <select name="status" class="form-select form-select-sm me-2" required>
                  <option value="" disabled selected>-- Chuyển sang --</option>
                  <option th:each="st : ${o.orderStatus.allowedNextStatuses}"
                          th:value="${st.name()}"
                          th:text="${st.displayName}">
                  </option>
                </select>

                <button type="submit" class="btn btn-outline-primary btn-sm" title="Xác nhận chuyển trạng thái">
                  <i class="bi bi-check2"></i>
                </button>
              </form>
            </td>

            <td class="text-center">
              <a th:href="@{'/admin/orders/' + ${o.id}}" class="btn btn-info btn-sm"><i class="bi bi-eye"></i></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="8" class="text-center text-muted">Không có đơn hàng nào</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <nav th:if="${!searchMode}">
    <ul class="pagination justify-content-center">

      <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
        <a class="page-link" th:href="@{'/admin/orders?page=' + ${currentPage - 1}}">«</a>
      </li>

      <li class="page-item"
          th:each="p : ${#numbers.sequence(0, totalPages-1)}"
          th:classappend="${p == currentPage} ? 'active'">
        <a class="page-link" th:text="${p + 1}"
           th:href="@{'/admin/orders?page=' + ${p}}"></a>
      </li>

      <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
        <a class="page-link" th:href="@{'/admin/orders?page=' + ${currentPage + 1}}">»</a>
      </li>

    </ul>
  </nav>

  <!-- 🔔 Toast thông báo -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="toastMessage" class="toast align-items-center text-white bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastText">Thành công!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script>
    function toggleAll(source) {
      document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = source.checked);
      updateBulkToolbar();
    }

    function updateBulkToolbar() {
      const checked = document.querySelectorAll('.order-checkbox:checked');
      const count = checked.length;
      const countEl = document.getElementById('selectedCount');
      const toolbar = document.getElementById('bulkToolbar');
      if (countEl) countEl.textContent = count;
      if (toolbar) toolbar.style.display = count > 0 ? 'block' : 'none';

      const all = document.querySelectorAll('.order-checkbox');
      const selectAll = document.getElementById('selectAll');
      if (selectAll && all.length > 0) {
        selectAll.checked = (checked.length === all.length);
      }
    }

    function confirmOrderStatusChange(form) {
      const select = form.querySelector('select[name="status"]');
      if (!select || !select.value) {
        alert('Vui lòng chọn trạng thái hợp lệ tiếp theo.');
        return false;
      }
      const nextLabel = select.options[select.selectedIndex].text;
      const orderLabel = form.getAttribute('data-order-code') || 'này';
      return confirm(`Xác nhận chuyển đơn hàng ${orderLabel} sang trạng thái "${nextLabel}"?`);
    }

    function applyBulkStatus() {
      const ids = [...document.querySelectorAll('.order-checkbox:checked')].map(cb => cb.value);
      const selectEl = document.getElementById('bulkStatus');
      const status = selectEl.value;
      if (!status || ids.length === 0) return alert('Vui lòng chọn trạng thái và ít nhất 1 đơn hàng');

      const statusLabel = selectEl.options[selectEl.selectedIndex].text;
      if (!confirm(`Xác nhận chuyển ${ids.length} đơn hàng đã chọn sang trạng thái "${statusLabel}"?`)) {
        return;
      }

      const csrfToken = document.querySelector('[name=_csrf]')?.value || '';

      fetch('/admin/orders/bulk-status', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-TOKEN': csrfToken
        },
        body: JSON.stringify({ ids: ids.map(Number), status: status })
      }).then(r => r.json()).then(data => {
        let msg = `Đã cập nhật thành công ${data.updated}/${data.total} đơn hàng.`;
        if (data.errors && data.errors.length > 0) {
          msg += `\n\nKhông thể cập nhật ${data.failed} đơn (do quy tắc chuyển trạng thái hoặc thiếu tồn kho):\n- ` + data.errors.join('\n- ');
        }
        alert(msg);
        location.reload();
      }).catch(err => {
        console.error(err);
        alert('Đã xảy ra lỗi khi cập nhật đơn hàng hàng loạt');
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll('.order-checkbox').forEach(cb => {
        cb.addEventListener('change', updateBulkToolbar);
      });

      const params = new URLSearchParams(window.location.search);

      let message = "";
      let type = "success";

      if (params.get("updated") === "true") {
        message = "Đã cập nhật trạng thái đơn hàng thành công!";
      }
      if (params.get("error") === "notfound") {
        message = "Không tìm thấy đơn hàng!";
        type = "danger";
      }

      if (message !== "") {
        const toastEl = document.getElementById("toastMessage");
        const toastText = document.getElementById("toastText");

        toastText.textContent = message;

        toastEl.classList.remove("bg-success", "bg-danger");
        toastEl.classList.add(type === "danger" ? "bg-danger" : "bg-success");

        const toast = new bootstrap.Toast(toastEl);
        toast.show();
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('adminOrderSearchForm');
      const input = document.getElementById('adminOrderSearchInput');
      const box = document.getElementById('adminOrderSuggestBox');
      if (!form || !input || !box) return;

      let timer = null;
      let activeIdx = -1;

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function highlightText(text, query) {
        const safe = escapeHtml(text);
        const q = (query || '').trim();
        if (!q) return safe;
        const escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return safe.replace(new RegExp('(' + escapedQ + ')', 'gi'), '<mark class="px-0 bg-warning-subtle fw-bold">$1</mark>');
      }

      function formatVnd(val) {
        if (val === null || val === undefined) return '0 ₫';
        return new Intl.NumberFormat('vi-VN').format(Math.round(val)) + ' ₫';
      }

      function closeBox() {
        box.classList.add('d-none');
        activeIdx = -1;
      }

      function updateActive() {
        box.querySelectorAll('.admin-suggest-item').forEach((el, idx) => {
          el.classList.toggle('active', idx === activeIdx);
        });
      }

      function renderSuggestions(items, query) {
        activeIdx = -1;
        if (!items || !items.length) {
          box.innerHTML = `<div class="p-3 text-center text-muted small">Không tìm thấy đơn hàng nào khớp với "<strong>${escapeHtml(query)}</strong>"</div>`;
          box.classList.remove('d-none');
          return;
        }

        const rowsHtml = items.map(item => `
          <a href="/admin/orders/${item.id}" class="admin-suggest-item">
            <div class="min-w-0">
              <div class="fw-semibold text-truncate" style="font-size:0.88rem;">
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle me-1">#${escapeHtml(item.id)}</span>
                <span>${highlightText(item.orderCode, query)}</span>
              </div>
              <div class="small text-muted text-truncate">
                ${highlightText(item.receiverName, query)} • ${highlightText(item.receiverPhone, query)}
              </div>
            </div>
            <div class="text-end flex-shrink-0 ms-2">
              <div class="fw-bold text-danger" style="font-size:0.85rem;">${formatVnd(item.totalAmount)}</div>
              <div class="small text-muted">${escapeHtml(item.statusDisplay)}</div>
            </div>
          </a>
        `).join('');

        const footerHtml = `<button type="button" class="admin-suggest-footer" id="adminOrderSuggestAllBtn">
          <i class="bi bi-search me-1"></i> Xem tất cả đơn hàng khớp "${escapeHtml(query)}"
        </button>`;

        box.innerHTML = rowsHtml + footerHtml;
        box.classList.remove('d-none');

        const allBtn = document.getElementById('adminOrderSuggestAllBtn');
        if (allBtn) {
          allBtn.addEventListener('click', () => form.submit());
        }
      }

      async function fetchSuggest(query) {
        try {
          const res = await fetch(`/admin/orders/api/suggest?q=${encodeURIComponent(query)}&limit=8`);
          if (!res.ok) return;
          const data = await res.json();
          if (input.value.trim() === query) {
            renderSuggestions(data, query);
          }
        } catch (e) {
          console.error('Lỗi gợi ý đơn hàng:', e);
        }
      }

      input.addEventListener('input', function () {
        const q = this.value.trim();
        clearTimeout(timer);
        if (!q) {
          box.innerHTML = '';
          closeBox();
          return;
        }
        timer = setTimeout(() => fetchSuggest(q), 180);
      });

      input.addEventListener('focus', function () {
        const q = this.value.trim();
        if (q && box.innerHTML.trim()) {
          box.classList.remove('d-none');
        } else if (q) {
          fetchSuggest(q);
        }
      });

      input.addEventListener('keydown', function (e) {
        if (box.classList.contains('d-none')) return;
        const els = box.querySelectorAll('.admin-suggest-item');
        if (!els.length) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeIdx = (activeIdx + 1) % els.length;
          updateActive();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIdx = (activeIdx - 1 + els.length) % els.length;
          updateActive();
        } else if (e.key === 'Enter' && activeIdx >= 0 && els[activeIdx]) {
          e.preventDefault();
          window.location.href = els[activeIdx].getAttribute('href');
        } else if (e.key === 'Escape') {
          closeBox();
        }
      });

      document.addEventListener('click', function (e) {
        if (!form.contains(e.target)) {
          closeBox();
        }
      });
    });
  </script>
  </body>
  </html>
