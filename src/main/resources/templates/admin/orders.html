  <!DOCTYPE html>
  <html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Quản lý đơn hàng - LaptopStore Admin'">Quản lý đơn hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
      body { background-color: #f6f7fb; font-family: 'Segoe UI', sans-serif; }
    </style>
  </head>

  <body>
  <!-- Sidebar -->
<div th:replace="~{fragments/admin_sidebar :: adminSidebar('orders')}"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container-fluid justify-content-end align-items-center gap-3">

      <a th:href="@{/}" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1">
        <i class="bi bi-globe"></i> Xem Website
      </a>

      <span class="text-secondary fw-semibold">
        👋 Xin chào, Admin
      </span>

      <form th:action="@{/logout}" method="post">
        <button class="btn btn-sm btn-outline-danger" type="submit">
          <i class="bi bi-box-arrow-right"></i> Đăng xuất
        </button>
      </form>

    </div>
  </nav>

  <!-- Content -->
  <div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold">Quản lý đơn hàng</h4>
      <form class="search-form desktop-search-form me-3"
            th:action="@{/admin/orders/search}"
            method="get"
            style="min-width: 350px;">

        <div class="input-group">
          <input type="text"
                 class="form-control"
                 name="q"
                 placeholder="Tìm theo tên hoặc ID…"
                 th:value="${q}">

          <button class="btn btn-primary" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </div>

      </form>
    </div>

    <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />

    <!-- 🔹 Bulk Action Toolbar -->
    <div id="bulkToolbar" style="display:none;" class="mb-3 p-3 bg-white border rounded shadow-sm">
      <div class="d-flex align-items-center gap-2">
        <span class="fw-semibold text-primary"><span id="selectedCount">0</span> đơn hàng được chọn</span>
        <select id="bulkStatus" class="form-select form-select-sm d-inline-block w-auto ms-2">
          <option value="">-- Chuyển sang trạng thái --</option>
          <option value="CONFIRMED">Đã xác nhận</option>
          <option value="PACKING">Đang đóng gói</option>
          <option value="SHIPPING">Đang giao hàng</option>
          <option value="DELIVERED">Đã giao hàng</option>
          <option value="CANCELLED">Đã hủy</option>
        </select>
        <button class="btn btn-primary btn-sm ms-1" onclick="applyBulkStatus()">
          <i class="bi bi-check-circle"></i> Áp dụng
        </button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body table-responsive">
        <table class="table align-middle table-hover">
          <thead class="table-light">
          <tr>
            <th><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
            <th>ID</th>
            <th>Người đặt</th>
            <th>SĐT</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th class="text-center">Hành động</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="o : ${orders}">
            <td><input type="checkbox" class="order-checkbox" th:value="${o.id}"></td>
            <td th:text="${o.id}"></td>
            <td th:text="${o.receiverName}"></td>
            <td th:text="${o.receiverPhone}"></td>
            <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
            <td>
              <!-- ❌ Nếu đơn hàng đã bị hủy hoặc hoàn tiền -->
              <span th:if="${o.orderStatus.name() == 'CANCELLED' or o.orderStatus.name() == 'REFUNDED'}"
                    class="badge" th:classappend="${o.orderStatus.badgeClass}"
                    th:text="${o.orderStatus.displayName}">
              </span>

              <!-- ✔ Nếu đơn hàng chưa hủy → cho phép cập nhật -->
              <form th:if="${o.orderStatus.name() != 'CANCELLED' and o.orderStatus.name() != 'REFUNDED'}"
                    th:action="@{'/admin/orders/update-status/' + ${o.id}}"
                    method="post"
                    class="d-flex align-items-center">

                <select name="status" class="form-select form-select-sm me-2">
                  <option th:each="st : ${T(com.laptopstore.laptopstore.enums.OrderStatus).values()}"
                          th:value="${st.name()}"
                          th:selected="${o.orderStatus == st}"
                          th:text="${st.displayName}">
                  </option>
                </select>

                <button class="btn btn-outline-primary btn-sm">
                  <i class="bi bi-check2"></i>
                </button>
              </form>
            </td>

            <td class="text-center">
              <a th:href="@{'/admin/orders/' + ${o.id}}" class="btn btn-info btn-sm"><i class="bi bi-eye"></i></a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="8" class="text-center text-muted">Không có đơn hàng nào</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <nav th:if="${!searchMode}">
    <ul class="pagination justify-content-center">

      <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
        <a class="page-link" th:href="@{'/admin/orders?page=' + ${currentPage - 1}}">«</a>
      </li>

      <li class="page-item"
          th:each="p : ${#numbers.sequence(0, totalPages-1)}"
          th:classappend="${p == currentPage} ? 'active'">
        <a class="page-link" th:text="${p + 1}"
           th:href="@{'/admin/orders?page=' + ${p}}"></a>
      </li>

      <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
        <a class="page-link" th:href="@{'/admin/orders?page=' + ${currentPage + 1}}">»</a>
      </li>

    </ul>
  </nav>

  <!-- 🔔 Toast thông báo -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="toastMessage" class="toast align-items-center text-white bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastText">Thành công!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script>
    function toggleAll(source) {
      document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = source.checked);
      updateBulkToolbar();
    }

    function updateBulkToolbar() {
      const checked = document.querySelectorAll('.order-checkbox:checked');
      const count = checked.length;
      const countEl = document.getElementById('selectedCount');
      const toolbar = document.getElementById('bulkToolbar');
      if (countEl) countEl.textContent = count;
      if (toolbar) toolbar.style.display = count > 0 ? 'block' : 'none';

      const all = document.querySelectorAll('.order-checkbox');
      const selectAll = document.getElementById('selectAll');
      if (selectAll && all.length > 0) {
        selectAll.checked = (checked.length === all.length);
      }
    }

    function applyBulkStatus() {
      const ids = [...document.querySelectorAll('.order-checkbox:checked')].map(cb => cb.value);
      const status = document.getElementById('bulkStatus').value;
      if (!status || ids.length === 0) return alert('Vui lòng chọn trạng thái và ít nhất 1 đơn hàng');

      const csrfToken = document.querySelector('[name=_csrf]')?.value || '';

      fetch('/admin/orders/bulk-status', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-TOKEN': csrfToken
        },
        body: JSON.stringify({ ids: ids.map(Number), status: status })
      }).then(r => r.json()).then(data => {
        alert(`Đã cập nhật ${data.updated} đơn hàng`);
        location.reload();
      }).catch(err => {
        console.error(err);
        alert('Đã xảy ra lỗi khi cập nhật đơn hàng hàng loạt');
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll('.order-checkbox').forEach(cb => {
        cb.addEventListener('change', updateBulkToolbar);
      });

      const params = new URLSearchParams(window.location.search);

      let message = "";
      let type = "success";

      if (params.get("added") === "true") {
        message = "Đã thêm sản phẩm thành công!";
      }
      if (params.get("updated") === "true") {
        message = "Đã cập nhật sản phẩm thành công!";
      }
      if (params.get("deleted") === "true") {
        message = "Đã xoá sản phẩm!";
        type = "danger";
      }
      if (params.get("error") === "brand") {
        message = "Không tìm thấy thương hiệu!";
        type = "danger";
      }
      if (params.get("error") === "notfound") {
        message = "Không tìm thấy sản phẩm!";
        type = "danger";
      }

      if (message !== "") {
        const toastEl = document.getElementById("toastMessage");
        const toastText = document.getElementById("toastText");

        toastText.textContent = message;

        toastEl.classList.remove("bg-success", "bg-danger");
        toastEl.classList.add(type === "danger" ? "bg-danger" : "bg-success");

        const toast = new bootstrap.Toast(toastEl);
        toast.show();
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
