<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Lịch sử Kho Hàng - LaptopStore Admin'">Lịch sử Kho Hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --primary: #d70018; }
    body { background-color: #f6f7fb; font-family: 'Segoe UI', sans-serif; }
    .badge-import { background-color: #198754; }
    .badge-export { background-color: #dc3545; }
    .badge-reserve { background-color: #fd7e14; }
    .badge-confirm { background-color: #0d6efd; }
    .badge-cancel { background-color: #6c757d; }
    .badge-adjust { background-color: #6610f2; }
    .qty-positive { color: #198754; font-weight: 600; }
    .qty-negative { color: #dc3545; font-weight: 600; }
    .sidebar-section { font-size: 0.72rem; text-transform: uppercase; color: rgba(255,255,255,0.4); padding: 12px 20px 4px; font-weight: 700; letter-spacing: .05em; }
  </style>
</head>

<body>
<!-- Sidebar -->
<div th:replace="~{fragments/admin_sidebar :: adminSidebar('stock')}"></div>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white shadow-sm px-3">
  <div class="container-fluid justify-content-end">
    <span class="me-3 text-secondary fw-semibold" sec:authentication="name">Admin</span>
    <a href="/logout" class="btn btn-sm btn-outline-danger">
      <i class="bi bi-box-arrow-right"></i> Đăng xuất
    </a>
  </div>
</nav>

<!-- Content -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-0"><i class="bi bi-archive me-2" style="color:var(--primary)"></i>Lịch sử Kho Hàng</h4>
      <small class="text-muted">Theo dõi mọi biến động nhập / xuất / khoá / hoàn kho</small>
    </div>
  </div>

  <!-- Filter Form -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form method="get" th:action="@{/admin/stock}" class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label fw-semibold">Loại biến động</label>
          <select name="type" class="form-select">
            <option value="">-- Tất cả --</option>
            <option th:each="lt : ${logTypes}"
                    th:value="${lt.name()}"
                    th:text="${lt.label}"
                    th:selected="${selectedType == lt.name()}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Từ ngày</label>
          <input type="date" name="from" class="form-control" th:value="${fromDate}">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Đến ngày</label>
          <input type="date" name="to" class="form-control" th:value="${toDate}">
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Lọc</button>
          <a th:href="@{/admin/stock}" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i></a>
        </div>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Thời gian</th>
            <th>Loại</th>
            <th>Sản phẩm</th>
            <th>Biến thể</th>
            <th class="text-center">Số lượng</th>
            <th class="text-center">Tồn sau</th>
            <th>Đơn hàng</th>
            <th>Người thực hiện</th>
            <th>Ghi chú</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${logs.isEmpty()}">
            <td colspan="10" class="text-center py-5 text-muted">
              <i class="bi bi-inbox fs-2 d-block mb-2"></i>
              Chưa có dữ liệu biến động kho
            </td>
          </tr>
          <tr th:each="log : ${logs.content}">
            <td class="text-muted" th:text="${log.id}"></td>
            <td>
              <small th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
            </td>
            <td>
              <!-- Badge theo loại -->
              <span th:switch="${log.type.name()}">
                <span th:case="'IMPORT'" class="badge badge-import"><i class="bi bi-box-arrow-in-down"></i> Nhập kho</span>
                <span th:case="'EXPORT_ORDER'" class="badge badge-export"><i class="bi bi-box-arrow-up"></i> Xuất kho</span>
                <span th:case="'RESERVE'" class="badge badge-reserve"><i class="bi bi-lock"></i> Khoá QR</span>
                <span th:case="'CONFIRM_RESERVE'" class="badge badge-confirm"><i class="bi bi-check-circle"></i> Xác nhận QR</span>
                <span th:case="'CANCEL_RESTORE'" class="badge badge-cancel"><i class="bi bi-arrow-counterclockwise"></i> Hoàn kho</span>
                <span th:case="'ADJUSTMENT'" class="badge badge-adjust"><i class="bi bi-pencil"></i> Điều chỉnh</span>
                <span th:case="*" class="badge bg-secondary" th:text="${log.type.label}"></span>
              </span>
            </td>
            <td>
              <span th:if="${log.product != null}" th:text="${log.product.name}" class="fw-semibold"></span>
              <span th:if="${log.product == null}" class="text-muted">–</span>
            </td>
            <td>
              <span th:if="${log.variant != null}"
                    th:text="${log.variant.color} + ' / ' + ${log.variant.storage}"
                    class="badge bg-light text-dark border"></span>
              <span th:if="${log.variant == null}" class="text-muted">–</span>
            </td>
            <td class="text-center">
              <span th:if="${log.quantity > 0}" class="qty-positive" th:text="'+' + ${log.quantity}"></span>
              <span th:if="${log.quantity <= 0}" class="qty-negative" th:text="${log.quantity}"></span>
            </td>
            <td class="text-center">
              <span th:text="${log.stockAfter}" class="badge bg-light text-dark border"></span>
            </td>
            <td>
              <a th:if="${log.order != null}"
                 th:href="@{'/admin/orders/' + ${log.order.id}}"
                 th:text="${log.order.orderCode}"
                 class="text-decoration-none small fw-semibold"></a>
              <span th:if="${log.order == null}" class="text-muted">–</span>
            </td>
            <td>
              <span th:text="${log.performedBy}" class="badge bg-secondary rounded-pill"></span>
            </td>
            <td>
              <small th:text="${log.note}" class="text-muted"></small>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-between align-items-center px-3 py-2 border-top" th:if="${totalPages > 1}">
        <small class="text-muted">Trang <strong th:text="${currentPage + 1}"></strong> / <strong th:text="${totalPages}"></strong></small>
        <nav>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
              <a class="page-link" th:href="@{/admin/stock(page=${currentPage - 1}, type=${selectedType}, from=${fromDate}, to=${toDate})}">‹</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
              <a class="page-link" th:href="@{/admin/stock(page=${i}, type=${selectedType}, from=${fromDate}, to=${toDate})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
              <a class="page-link" th:href="@{/admin/stock(page=${currentPage + 1}, type=${selectedType}, from=${fromDate}, to=${toDate})}">›</a>
            </li>
          </ul>
        </nav>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
