<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Quản lý Thương hiệu - LaptopStore Admin'">Quản lý Thương hiệu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background-color: #f6f7fb; font-family: 'Segoe UI', sans-serif; }
    .brand-logo-img { width: 60px; height: auto; border-radius: 6px; }
  </style>
</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/admin_sidebar :: adminSidebar('brands')}"></div>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container-fluid justify-content-end align-items-center">

    <span class="me-3 text-secondary fw-semibold">
      👋 Xin chào, Admin
    </span>

    <a href="/logout" class="btn btn-sm btn-outline-danger">
      <i class="bi bi-box-arrow-right"></i> Đăng xuất
    </a>

  </div>
</nav>

<!-- Content -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">Quản lý Thương hiệu</h4>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
      <i class="bi bi-plus-circle"></i> Thêm thương hiệu
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body table-responsive">
      <table class="table align-middle table-hover">
        <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Logo</th>
          <th>Tên thương hiệu</th>
          <th>Mô tả</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${brands}">
          <td th:text="${b.id}"></td>
          <td>
            <img th:if="${b.logo != null}" th:src="@{'/images/brands/' + ${b.logo}}" class="brand-logo-img">
            <span th:if="${b.logo == null}" class="text-muted">Không có</span>
          </td>
          <td th:text="${b.name}"></td>
          <td th:text="${b.description}"></td>
          <td>
            <span th:text="${b.active ? 'Hoạt động' : 'Ngừng'}"
                  th:classappend="${b.active} ? 'text-success' : 'text-danger'"></span>
          </td>
          <td>
            <button class="btn btn-warning btn-sm" data-bs-toggle="modal"
                    th:data-bs-target="'#editModal_' + ${b.id}">
              <i class="bi bi-pencil"></i>
            </button>
            <form th:action="@{'/admin/brands/delete/' + ${b.id}}" method="post" style="display:inline;">
              <button class="btn btn-danger btn-sm" onclick="return confirm('Xóa thương hiệu này?')">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(brands)}">
          <td colspan="6" class="text-center text-muted">Chưa có thương hiệu nào</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal thêm brand -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/admin/brands/add}" method="post">
        <div class="modal-header">
          <h5 class="modal-title">Thêm Thương hiệu</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-12">
            <label class="form-label">Tên thương hiệu</label>
            <input name="name" type="text" class="form-control" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Logo (Upload)</label>
            <input name="logoFile" type="file" accept="image/*" class="form-control">
          </div>
          <div class="col-md-12">
            <label class="form-label">Mô tả</label>
            <textarea name="description" class="form-control" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary">Lưu</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal sửa brand -->
<div th:each="b : ${brands}">
  <div class="modal fade" th:id="'editModal_' + ${b.id}" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form th:action="@{'/admin/brands/edit/' + ${b.id}}" method="post">
          <div class="modal-header">
            <h5 class="modal-title">Sửa Thương hiệu</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body row g-3">
            <div class="col-md-12">
              <label class="form-label">Tên thương hiệu</label>
              <input type="text" name="name" class="form-control" th:value="${b.name}" required>
            </div>

            <div class="col-md-12" th:if="${b.logo != null}">
              <label class="form-label">Logo hiện tại</label><br>
              <img th:src="@{'/images/brands/' + ${b.logo}}" style="height:70px;border-radius:6px;">
            </div>

            <div class="col-md-12">
              <label class="form-label">Logo (Upload)</label>
              <input name="logoFile" type="file" accept="image/*" class="form-control">
            </div>

            <div class="col-md-12">
              <label class="form-label">Mô tả</label>
              <textarea name="description" class="form-control" rows="2"
                        th:text="${b.description}"></textarea>
            </div>

            <div class="col-md-12">
              <label class="form-label">Trạng thái</label>
              <select name="active" class="form-select">
                <option value="true" th:selected="${b.active}">Hoạt động</option>
                <option value="false" th:selected="${!b.active}">Ngừng</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary">Cập nhật</button>
            <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div id="toastMessage" class="toast text-white bg-success border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastText"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    let message = "", type = "success";

    if (params.get("success") === "added") message = "Đã thêm thương hiệu!";
    if (params.get("success") === "updated") message = "Đã cập nhật thương hiệu!";
    if (params.get("success") === "deleted") { message = "Đã xoá thương hiệu!"; type = "danger"; }
    if (params.get("error") === "exists") { message = "Tên thương hiệu đã tồn tại!"; type = "danger"; }

    if (message) {
      const toastEl = document.getElementById("toastMessage");
      const toastText = document.getElementById("toastText");
      toastText.textContent = message;

      toastEl.classList.remove("bg-success", "bg-danger");
      toastEl.classList.add(type === "danger" ? "bg-danger" : "bg-success");

      new bootstrap.Toast(toastEl).show();
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
