<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} ?: 'Quản lý Người dùng - TechStore Admin'">Quản lý Người dùng</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background-color: #f6f7fb; font-family: 'Segoe UI', sans-serif; }
    .sidebar { width: 240px; height: 100vh; position: fixed; top: 0; left: 0; background: #1e1f26; color: #fff; padding-top: 60px; }
    .sidebar a { color: #bbb; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a.active, .sidebar a:hover { background: #343541; color: #fff; }
    .navbar { position: fixed; left: 240px; right: 0; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd; }
    .content { margin-left: 240px; padding: 80px 20px 40px; }
    .brand-logo { font-weight: bold; color: #fff; font-size: 1.2rem; padding: 10px 20px; position: absolute; top: 0; left: 0; background: #111; width: 240px; text-align: center; }
  </style>
</head>

<body>
<div class="brand-logo">⚙️ TechStore Admin</div>

<!-- Sidebar -->
<div class="sidebar">
  <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active'"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a th:href="@{/admin/products}" th:classappend="${active == 'products'} ? 'active'"><i class="bi bi-box"></i> Sản phẩm</a>
  <a th:href="@{/admin/orders}" th:classappend="${active == 'orders'} ? 'active'"><i class="bi bi-receipt"></i> Đơn hàng</a>
  <a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'active'"><i class="bi bi-people"></i> Người dùng</a>
  <a th:href="@{/admin/vouchers}" th:classappend="${active == 'vouchers'} ? 'active'"><i class="bi bi-ticket-perforated"></i> Voucher</a>
  <a th:href="@{/admin/brands}" th:classappend="${active == 'brands'} ? 'active'"><i class="bi bi-tags"></i> Thương hiệu</a>
</div>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container-fluid justify-content-end align-items-center">

    <span class="me-3 text-secondary fw-semibold">
      👋 Xin chào, Admin
    </span>

    <a href="/logout" class="btn btn-sm btn-outline-danger">
      <i class="bi bi-box-arrow-right"></i> Đăng xuất
    </a>

  </div>
</nav>

<!-- Content -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">Quản lý Người dùng</h4>
  </div>

  <div class="card shadow-sm">
    <div class="card-body table-responsive">
      <table class="table align-middle table-hover">
        <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Họ tên</th>
          <th>Tên đăng nhập</th>
          <th>Email</th>
          <th>Điện thoại</th>
          <th>Vai trò</th>
          <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.id}"></td>
          <td th:text="${u.fullName}"></td>
          <td th:text="${u.username}"></td>
          <td th:text="${u.email}"></td>
          <td th:text="${u.phone ?: '-'}"></td>
          <td>
            <span th:each="r : ${u.roles}" th:text="${r.name}" class="badge bg-secondary me-1"></span>
          </td>
          <td>
            <button class="btn btn-warning btn-sm" data-bs-toggle="modal"
                    th:data-bs-target="'#editModal_' + ${u.id}">
              <i class="bi bi-pencil"></i>
            </button>
            <form th:action="@{'/admin/users/delete/' + ${u.id}}" method="post" style="display:inline;">
              <button class="btn btn-danger btn-sm" onclick="return confirm('Xóa người dùng này?')">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
          <td colspan="7" class="text-center text-muted">Không có người dùng nào</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal chỉnh sửa người dùng -->
<div th:each="u : ${users}" th:id="'editModal_' + ${u.id}" class="modal fade" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form th:action="@{'/admin/users/edit/' + ${u.id}}" method="post">
        <div class="modal-header">
          <h5 class="modal-title">Chỉnh sửa thông tin</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-12">
            <label class="form-label">Họ tên</label>
            <input name="fullName" class="form-control" th:value="${u.fullName}" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Email</label>
            <input name="email" class="form-control" type="email" th:value="${u.email}" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Điện thoại</label>
            <input name="phone" class="form-control" th:value="${u.phone}">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary">Lưu</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
