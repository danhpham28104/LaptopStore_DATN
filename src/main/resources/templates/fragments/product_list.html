<!-- ✅ templates/fragments/product_list.html -->
<!--
  Fragment render các card sản phẩm (cột) hỗ trợ Wishlist, So sánh 2-4 sản phẩm và Đánh giá
-->

<th:block th:fragment="productList" xmlns:th="http://www.thymeleaf.org">
  <div class="col-lg-3 col-md-6 mb-4" th:each="p : ${products}">
    <div class="product-item position-relative h-100 d-flex flex-column border rounded-3 bg-white shadow-sm overflow-hidden">

      <!-- Wishlist Action Button overlay -->
      <button type="button" class="btn-wishlist-toggle position-absolute top-0 end-0 m-2 border-0 bg-white rounded-circle shadow-sm d-flex align-items-center justify-content-center"
              style="width:34px; height:34px; z-index:10; color:#ef4444;"
              th:data-product-id="${p.id}"
              onclick="toggleWishlist(this)"
              title="Lưu sản phẩm yêu thích">
        <i class="bi bi-heart fs-6"></i>
      </button>

      <!-- Product Image -->
      <div class="product-image position-relative text-center p-3 bg-light">
        <a th:href="@{'/product/' + ${p.id}}">
          <!-- HOT badge -->
          <span class="my-badge badge-hot position-absolute top-0 start-0 m-2"
                th:if="${p.badge != null and p.badge.equalsIgnoreCase('HOT')}">
            <i class="bi bi-fire"></i> HOT
          </span>

          <!-- NEW badge -->
          <span class="my-badge badge-new position-absolute top-0 start-0 m-2"
                th:if="${p.createdAt != null and p.createdAt.isAfter(T(java.time.LocalDateTime).now().minusDays(7))}">
            <i class="bi bi-stars"></i> NEW
          </span>

          <!-- LIMITED badge -->
          <span class="my-badge badge-limited position-absolute top-0 start-0 m-2"
                th:if="${p.stock < 10 and p.stock > 0}">
            <i class="bi bi-exclamation-triangle-fill"></i> SẮP HẾT
          </span>

          <!-- Product image -->
          <img th:if="${p.images != null and !p.images.isEmpty()}"
               th:src="${#strings.arraySplit(p.images, ',')[0]}"
               th:alt="${p.name}"
               style="max-height: 170px; object-fit: contain;"
               loading="lazy"
               onerror="this.src='/images/default-avatar.png'">
          <img th:if="${p.images == null or p.images.isEmpty()}"
               th:src="@{/images/default-avatar.png}"
               style="max-height: 170px; object-fit: contain;"
               loading="lazy"
               alt="Laptop">
        </a>
      </div>

      <!-- Product Info -->
      <div class="product-info p-3 d-flex flex-column flex-grow-1">

        <!-- Brand name -->
        <div class="text-muted small mb-1" th:text="${p.brand != null ? p.brand.name : 'Khác'}">Hãng</div>

        <!-- Product name + sale badge -->
        <h6 class="product-name fw-bold mb-1 text-truncate">
          <a th:href="@{'/product/' + ${p.id}}"
             class="text-decoration-none text-dark"
             th:text="${p.name}"
             th:title="${p.name}">Tên laptop</a>
          <span class="badge bg-danger ms-1"
                th:if="${p.salePercent != null and p.salePercent > 0}"
                th:text="'-' + ${p.salePercent} + '%'">-10%</span>
        </h6>

        <!-- Quick spec tags -->
        <div class="display-tags d-flex flex-wrap gap-1 mb-2">
          <span class="badge bg-light text-dark border"
                th:if="${p.cpu != null and !p.cpu.isBlank()}"
                th:text="${p.cpu}"></span>
          <span class="badge bg-light text-dark border"
                th:if="${p.ram != null and !p.ram.isBlank()}"
                th:text="${p.ram}"></span>
          <span class="badge bg-light text-dark border"
                th:if="${!#lists.isEmpty(p.variants)}"
                th:text="${p.variants[0].storage}"></span>
        </div>

        <!-- Pricing -->
        <div class="product-price mt-auto mb-2">
          <span class="fw-bold text-primary fs-5"
                th:text="${#numbers.formatDecimal(p.finalPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
          <span class="text-muted text-decoration-line-through small ms-1"
                th:if="${p.salePercent != null and p.salePercent > 0}"
                th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
        </div>

        <!-- Dual CTA Buttons & Compare Button -->
        <div class="card-btn-group d-flex gap-2">
          <button type="button"
                  class="btn btn-outline-primary btn-sm flex-grow-1 rounded-pill btn-quick-add-cart"
                  th:data-product-id="${p.id}"
                  th:data-product-name="${p.name}">
            <i class="bi bi-cart-plus"></i> + Giỏ
          </button>

          <!-- Compare Multi-Product Toggle Button -->
          <button type="button"
                  class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center btn-compare-toggle"
                  style="width: 32px; height: 32px;"
                  th:data-product-id="${p.id}"
                  th:data-product-name="${p.name}"
                  th:data-product-image="${p.images != null ? #strings.arraySplit(p.images, ',')[0] : '/images/default-avatar.png'}"
                  onclick="toggleCompareItem(this.getAttribute('data-product-id'), this.getAttribute('data-product-name'), this.getAttribute('data-product-image'))"
                  title="Thêm/Xóa sản phẩm khỏi danh sách so sánh (Tối đa 4 sản phẩm)">
            <i class="bi bi-arrow-left-right"></i>
          </button>
        </div>

      </div>
    </div>
  </div>

  <script th:inline="javascript">
    function toggleWishlist(btn) {
      const productId = btn.getAttribute('data-product-id');
      fetch('/api/wishlist/toggle?productId=' + productId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      })
      .then(res => {
        if (res.status === 401) {
          window.location.href = '/login';
          return;
        }
        return res.json();
      })
      .then(data => {
        if (data && data.success) {
          const icon = btn.querySelector('i');
          if (data.wishlisted) {
            icon.className = 'bi bi-heart-fill fs-6';
          } else {
            icon.className = 'bi bi-heart fs-6';
          }
          const badge = document.getElementById('headerWishlistBadge');
          if (badge) {
            badge.innerText = data.count;
            badge.style.display = data.count > 0 ? 'inline-block' : 'none';
          }
        } else if (data && data.message) {
          alert(data.message);
        }
      })
      .catch(err => console.error(err));
    }
  </script>
</th:block>
