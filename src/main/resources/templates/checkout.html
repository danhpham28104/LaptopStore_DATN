<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Thanh toán - LaptopStore</title>

  <!-- Favicon -->
  <link th:href="@{/assets/img/favicon.png}" rel="icon">
  <link th:href="@{/assets/img/apple-touch-icon.png}" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
  <link th:href="@{/css/swiper-bundle.min.css}" rel="stylesheet">
  <link th:href="@{/css/aos.css}" rel="stylesheet">
  <link th:href="@{/css/glightbox.min.css}" rel="stylesheet">
  <link th:href="@{/css/main.css}" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="checkout-page">

<!-- ✅ Header -->
<div th:replace="fragments/header :: siteHeader"></div>

<main class="main">

  <!-- Page Title -->
  <div class="page-title light-background">
    <div class="container d-lg-flex justify-content-between align-items-center">
      <h1>Thanh toán</h1>
      <nav class="breadcrumbs">
        <ol>
          <li><a th:href="@{/}">Trang chủ</a></li>
          <li class="current">Thanh toán</li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- Checkout Section -->
  <section id="checkout" class="checkout section">
    <div class="container" data-aos="fade-up">

      <div class="row">
        <!-- 🧾 Thông tin khách hàng -->
        <div class="col-lg-7">
          <form th:action="@{/checkout/place}" method="post" class="checkout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- 🧾 CHỌN ĐỊA CHỈ -->
            <div class="checkout-section mb-4">
              <div class="section-header">
                <div class="section-number">1</div>
                <h3>Chọn địa chỉ giao hàng</h3>
              </div>

              <div class="section-content">

                <!-- Nếu chưa có địa chỉ -->
                <div id="noAddressAlert" th:classappend="${#lists.isEmpty(addresses)} ? '' : 'd-none'" class="alert alert-warning">
                  <span>Bạn chưa có địa chỉ giao hàng.</span>
                  <button type="button" class="btn btn-primary btn-sm ms-2" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                    + Thêm địa chỉ
                  </button>
                </div>

                <!-- Danh sách địa chỉ -->
                <div id="addressSelectContainer" th:style="${#lists.isEmpty(addresses)} ? 'display:none;' : 'display:block;'">

                  <select id="addressSelect" name="addressId" class="form-select" required>
                    <option value="">— Chọn địa chỉ giao hàng —</option>

                    <option th:each="a : ${addresses}"
                            th:value="${a.id}"
                            th:selected="${a.default}"
                            th:text="${a.fullName + ' (' + a.phone + ') - '
                             + a.addressLine + ', '
                             + (a.ward != null and a.ward != '' ? a.ward + ', ' : '')
                             + (a.district != null and a.district != '' ? a.district + ', ' : '')
                             + a.city}">
                    </option>

                  </select>

                  <small class="text-muted d-block mt-2">
                    Muốn thêm địa chỉ mới?
                    <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" data-bs-toggle="modal" data-bs-target="#addAddressModal">
                      Thêm ngay
                    </button>
                  </small>

                </div>

              </div>
            </div>


            <!-- Phương thức thanh toán -->
            <div class="checkout-section" id="payment-method">
              <div class="section-header">
                <div class="section-number">2</div>
                <h3>Phương thức thanh toán</h3>
              </div>

              <div class="section-content">

                <!-- COD -->
                <div class="form-check mb-2">
                  <input class="form-check-input" type="radio" id="cod" name="paymentMethod" value="COD" checked>
                  <label class="form-check-label" for="cod">Thanh toán khi nhận hàng (COD)</label>
                </div>

                <!-- ⭐ SePay -->
                <div class="form-check mb-2">
                  <input class="form-check-input" type="radio" id="sepay" name="paymentMethod" value="SEPAY">
                  <label class="form-check-label" for="sepay">
                    Thanh toán qua <img src="/images/sepay_logo.png" alt="SePay" style="height:20px;"> SePay
                  </label>
                </div>

              </div>
            </div>


            <!-- Mã giảm giá -->
            <div class="checkout-section">
              <div class="section-header">
                <div class="section-number">3</div>
                <h3>Mã giảm giá</h3>
              </div>

              <div class="d-flex">
                <input type="text" id="voucherInput" name="voucherCode" class="form-control" placeholder="Nhập mã giảm giá">

                <button type="button" id="applyVoucherBtn" class="btn btn-primary ms-2">
                  Áp dụng
                </button>

                <!-- 🔥 Nút XÓA voucher (ẩn ban đầu) -->
                <button type="button" id="clearVoucherBtn" class="btn btn-outline-danger ms-2" style="display:none;">
                  Xóa
                </button>
              </div>

              <p id="voucherMessage" class="mt-2"></p>

            </div>

            <!-- Đặt hàng -->
            <div class="checkout-section" id="order-review">
              <div class="section-header">
                <div class="section-number">4</div>
                <h3>Xác nhận đặt hàng</h3>
              </div>
              <div class="section-content">
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" id="terms" required>
                  <label class="form-check-label" for="terms">
                    Tôi đồng ý với <a href="#">Điều khoản & Chính sách</a>
                  </label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đặt hàng ngay</button>
              </div>
            </div>
          </form>
        </div>

        <!-- 🧮 Tóm tắt đơn hàng -->
        <div class="col-lg-5">
          <div class="order-summary" data-aos="fade-left">
            <div class="order-summary-header d-flex justify-content-between align-items-center mb-3">
              <h3>Tóm tắt đơn hàng</h3>
              <span th:text="${#lists.size(cart.items)} + ' sản phẩm'"></span>
            </div>

            <div class="order-summary-content">
              <div class="order-items">
                <div th:each="item : ${cart.items}" class="order-item d-flex align-items-center mb-3 border-bottom pb-2">
                  <div class="order-item-image me-3">
                    <img th:src="${item.variant != null and item.variant.image != null and !item.variant.image.isEmpty() ? item.variant.image : (item.product != null and item.product.images != null ? #strings.arraySplit(item.product.images, ',')[0] : '/images/default-avatar.png')}" alt="Product" style="width:70px; height:70px; object-fit:cover;">
                  </div>
                  <div class="order-item-details flex-grow-1">
                    <h6 th:text="${item.product.name}"></h6>

                    <!-- 🔹 Hiển thị biến thể người dùng chọn -->
                    <p class="text-muted mb-1" th:if="${item.variant != null}">
                      <span th:text="'Màu: ' + ${item.variant.color}"></span>
                      <span th:if="${item.variant.storage != null}" th:text="' | SSD: ' + ${item.variant.storage}"></span>
                    </p>

                    <p class="mb-1">Số lượng: <span th:text="${item.quantity}"></span></p>
                    <p class="fw-bold text-end mb-0" th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></p>
                  </div>
                </div>
              </div>


              <div class="d-flex justify-content-between">
                <span>Tạm tính</span>
                <span id="subtotalDisplay"
                      th:text="${#numbers.formatDecimal(cart.subtotal, 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                </span>
              </div>

              <div class="d-flex justify-content-between">
                <span>Giảm giá</span>
                <span id="discountDisplay"
                      th:text="${#numbers.formatDecimal(cart.discount, 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                </span>
              </div>

              <div class="d-flex justify-content-between fw-bold mt-2">
                <span>Tổng cộng</span>
                <span id="totalDisplay" class="text-primary fs-5"
                      th:text="${#numbers.formatDecimal(cart.total, 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                </span>
              </div>

            </div>
          </div>
        </div> <!-- End Summary -->
      </div>

    </div>
  </section>
</main>

<!-- ✅ Footer -->
<div th:replace="fragments/footer :: siteFooter"></div>

<!-- Scroll Top -->
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
  <i class="bi bi-arrow-up-short"></i>
</a>

<!-- JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/swiper-bundle.min.js}"></script>
<script th:src="@{/js/aos.js}"></script>
<script th:src="@{/js/glightbox.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
  const subtotal = /*[[${cart.subtotal}]]*/ 0;
</script>



<script>
  const input = document.getElementById("voucherInput");
  const msg = document.getElementById("voucherMessage");
  const discountDisplay = document.getElementById("discountDisplay");
  const totalDisplay = document.getElementById("totalDisplay");
  const applyBtn = document.getElementById("applyVoucherBtn");
  const clearBtn = document.getElementById("clearVoucherBtn");

  // =============================
  // 👉 Áp dụng voucher
  // =============================
  applyBtn.addEventListener('click', function () {

    const code = input.value.trim();
    if (code === "") {
      msg.innerHTML = "<span class='text-danger'>Vui lòng nhập mã!</span>";
      return;
    }

    fetch(`/api/voucher/check?code=${code}&subtotal=${subtotal}`)
      .then(res => res.json())
      .then(data => {

        if (!data.valid) {
          msg.innerHTML = `<span class='text-danger'>${data.message}</span>`;
          discountDisplay.innerText = "0 ₫";
          totalDisplay.innerText = subtotal.toLocaleString("vi-VN") + " ₫";

          // Ẩn nút xóa
          clearBtn.style.display = "none";
        } else {

          msg.innerHTML = `<span class='text-success fw-bold'>${data.message}</span>`;

          const discount = data.discount;
          const total = subtotal - discount;

          discountDisplay.innerText = discount.toLocaleString("vi-VN") + " ₫";
          totalDisplay.innerText = total.toLocaleString("vi-VN") + " ₫";

          // 🔥 Hiện nút xóa voucher
          clearBtn.style.display = "block";
        }
      });
  });

  // =============================
  // 👉 Xóa voucher — reset mọi thứ
  // =============================
  clearBtn.addEventListener('click', function () {

    // Xóa input
    input.value = "";

    // Xóa message
    msg.innerHTML = "";

    // Reset về mặc định
    discountDisplay.innerText = "0 ₫";
    totalDisplay.innerText = subtotal.toLocaleString("vi-VN") + " ₫";

    // Ẩn nút xóa
    clearBtn.style.display = "none";
  });
</script>

<!-- Modal Thêm Địa Chỉ Nhanh -->
<div class="modal fade" id="addAddressModal" tabindex="-1" aria-labelledby="addAddressModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="addAddressModalLabel"><i class="bi bi-geo-alt-fill text-primary me-2"></i>Thêm địa chỉ giao hàng mới</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="quickAddAddressForm">
        <div class="modal-body">
          <div id="modalAddressAlert" class="alert alert-danger d-none mb-3"></div>
          
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
              <input type="text" id="modalFullName" name="fullName" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
              <input type="tel" id="modalPhone" name="phone" class="form-control" placeholder="Ví dụ: 0987654321" required>
            </div>

            <div class="col-md-12">
              <label class="form-label fw-semibold">Địa chỉ chi tiết (Số nhà, tên đường...) <span class="text-danger">*</span></label>
              <input type="text" id="modalAddressLine" name="addressLine" class="form-control" placeholder="Ví dụ: 123 Đường ABC" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Tỉnh / Thành phố <span class="text-danger">*</span></label>
              <input type="text" id="modalCity" name="city" class="form-control" placeholder="Ví dụ: Hà Nội" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Quận / Huyện</label>
              <input type="text" id="modalDistrict" name="district" class="form-control" placeholder="Ví dụ: Cầu Giấy">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Phường / Xã</label>
              <input type="text" id="modalWard" name="ward" class="form-control" placeholder="Ví dụ: Dịch Vọng">
            </div>

            <div class="col-md-12 form-check mt-3 ms-2">
              <input type="checkbox" id="modalIsDefault" name="isDefault" class="form-check-input" checked>
              <label class="form-check-label" for="modalIsDefault">Đặt làm địa chỉ mặc định</label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" id="btnSaveAddress" class="btn btn-primary px-4">
            <span id="btnSaveAddressSpinner" class="spinner-border spinner-border-sm me-1 d-none" role="status" aria-hidden="true"></span>
            Lưu địa chỉ
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const addressForm = document.getElementById("quickAddAddressForm");
  if (!addressForm) return;

  addressForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const alertBox = document.getElementById("modalAddressAlert");
    const btnSave = document.getElementById("btnSaveAddress");
    const spinner = document.getElementById("btnSaveAddressSpinner");

    alertBox.classList.add("d-none");
    btnSave.disabled = true;
    spinner.classList.remove("d-none");

    const payload = {
      fullName: document.getElementById("modalFullName").value.trim(),
      phone: document.getElementById("modalPhone").value.trim(),
      addressLine: document.getElementById("modalAddressLine").value.trim(),
      city: document.getElementById("modalCity").value.trim(),
      district: document.getElementById("modalDistrict").value.trim(),
      ward: document.getElementById("modalWard").value.trim(),
      isDefault: document.getElementById("modalIsDefault").checked,
      default: document.getElementById("modalIsDefault").checked
    };

    fetch("/api/addresses", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    })
      .then(res => {
        if (!res.ok) {
          return res.json().then(err => { throw new Error(err.message || "Không thể thêm địa chỉ"); });
        }
        return res.json();
      })
      .then(data => {
        btnSave.disabled = false;
        spinner.classList.add("d-none");

        if (data.success && data.address) {
          const addr = data.address;
          const select = document.getElementById("addressSelect");
          const noAlert = document.getElementById("noAddressAlert");
          const container = document.getElementById("addressSelectContainer");

          let text = addr.fullName + " (" + addr.phone + ") - " + addr.addressLine;
          if (addr.ward) text += ", " + addr.ward;
          if (addr.district) text += ", " + addr.district;
          if (addr.city) text += ", " + addr.city;

          const option = new Option(text, addr.id, true, true);
          select.add(option, undefined);
          select.value = addr.id;

          if (noAlert) noAlert.classList.add("d-none");
          if (container) container.style.display = "block";

          addressForm.reset();
          document.getElementById("modalIsDefault").checked = true;

          const modalEl = document.getElementById("addAddressModal");
          const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
          modal.hide();
        } else {
          alertBox.innerText = data.message || "Có lỗi xảy ra khi lưu địa chỉ";
          alertBox.classList.remove("d-none");
        }
      })
      .catch(err => {
        btnSave.disabled = false;
        spinner.classList.add("d-none");
        alertBox.innerText = err.message || "Không thể kết nối đến máy chủ";
        alertBox.classList.remove("d-none");
      });
  });
});
</script>

</body>
</html>
